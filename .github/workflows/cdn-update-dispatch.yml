name: Notify Main Repo on CDN Update

# Triggers when CDN content is pushed to main branch
on:
  push:
    branches:
      - main
    paths:
      - 'PATCH_NOTES_PUBLIC.json'
      - 'faqData.json'
      - '*.png'
      - '*.svg'
      - '*.txt'

jobs:
  dispatch-to-main-repo:
    runs-on: ubuntu-latest
    env:
      MAIN_REPO_PAT: ${{ secrets.MAIN_REPO_PAT }}
    
    steps:
      - name: Checkout CDN repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need 2 commits to check what changed
      
      - name: Get changed files
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^..HEAD | tr '\n' ', ')
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "📝 Changed files: $CHANGED_FILES"
      
      - name: Dispatch to main repository
        if: ${{ env.MAIN_REPO_PAT != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.MAIN_REPO_PAT }}
          repository: JMonkeyFan/BelgianWageCalculator2025
          event-type: cdn-content-updated
          client-payload: |
            {
              "changed_files": "${{ steps.changes.outputs.files }}",
              "commit_sha": "${{ github.sha }}",
              "commit_message": "${{ github.event.head_commit.message }}",
              "pusher": "${{ github.event.pusher.name }}"
            }

      - name: Skip dispatch when token is unavailable
        if: ${{ env.MAIN_REPO_PAT == '' }}
        run: echo "::warning::MAIN_REPO_PAT is not configured; skipping repository dispatch to JMonkeyFan/BelgianWageCalculator2025."
      
      - name: Confirmation
        if: ${{ env.MAIN_REPO_PAT != '' }}
        run: |
          echo "✅ Dispatched 'cdn-content-updated' event to main repository"
          echo "🎯 Main repo will auto-increment DATA_VERSION and redeploy"
